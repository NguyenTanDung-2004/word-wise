<!DOCTYPE html>
<html>
  <head>
    <title>WordWise WebSocket Test</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.5.1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
      body {
        font-family: sans-serif;
        display: flex;
        gap: 20px;
      }
      .panel {
        border: 1px solid #ccc;
        padding: 10px;
        width: 45%;
      }
      #messages {
        border: 1px solid #eee;
        padding: 5px;
        height: 300px;
        overflow-y: scroll;
        margin-top: 10px;
      }
      .msg {
        padding: 5px;
        border-bottom: 1px dotted #ccc;
      }
      .sent {
        background-color: #e1ffc7;
      }
      .received {
        background-color: #f0f0f0;
      }
      input,
      button {
        padding: 8px;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h2>User A</h2>
      <input
        type="text"
        id="tokenA"
        placeholder="User A Token"
        size="50"
      /><br /><br />
      <input type="text" id="convIdA" placeholder="Conversation ID" value="1" />
      <button onclick="connect('A')">Connect & Subscribe</button>
      <button onclick="disconnect('A')">Disconnect</button>
      <hr />
      <input type="text" id="receiverIdA" placeholder="Receiver ID (e.g., 2)" />
      <input type="text" id="messageA" placeholder="Type message..." />
      <button onclick="sendMessage('A')">Send via API</button>
      <div id="statusA">Status: Disconnected</div>
      <div id="messagesA" class="messages"></div>
    </div>

    <div class="panel">
      <h2>User B</h2>
      <input
        type="text"
        id="tokenB"
        placeholder="User B Token"
        size="50"
      /><br /><br />
      <input type="text" id="convIdB" placeholder="Conversation ID" value="1" />
      <button onclick="connect('B')">Connect & Subscribe</button>
      <button onclick="disconnect('B')">Disconnect</button>
      <hr />
      <input type="text" id="receiverIdB" placeholder="Receiver ID (e.g., 1)" />
      <input type="text" id="messageB" placeholder="Type message..." />
      <button onclick="sendMessage('B')">Send via API</button>
      <div id="statusB">Status: Disconnected</div>
      <div id="messagesB" class="messages"></div>
    </div>

    <script>
      const clients = { A: null, B: null };
      const serverUrl = "http://localhost:8080";

      function log(user, message, type) {
        const messagesDiv = document.getElementById(`messages${user}`);
        const msgDiv = document.createElement("div");
        msgDiv.className = `msg ${type || ""}`;
        msgDiv.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
        messagesDiv.appendChild(msgDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      }

      function connect(user) {
        const token = document.getElementById(`token${user}`).value;
        const convId = document.getElementById(`convId${user}`).value;
        const statusDiv = document.getElementById(`status${user}`);

        if (!token || !convId) {
          alert("Please provide Token and Conversation ID");
          return;
        }

        const socket = new SockJS(`${serverUrl}/ws`);
        const stompClient = Stomp.over(socket);
        clients[user] = stompClient;

        const headers = { Authorization: `Bearer ${token}` };

        stompClient.connect(
          headers,
          () => {
            statusDiv.textContent = "Status: Connected!";
            log(user, "WebSocket Connected.");

            const destination = `/topic/conversation/${convId}`;
            stompClient.subscribe(destination, (message) => {
              const msgBody = JSON.parse(message.body);
              const currentUserId = user === "A" ? 1 : 2; // Giả định ID
              const type =
                msgBody.senderId === currentUserId ? "sent" : "received";
              log(user, `Received: ${msgBody.content}`, type);
            });
            log(user, `Subscribed to ${destination}`);
          },
          (error) => {
            statusDiv.textContent = "Status: Error";
            log(user, `Error: ${error}`);
            console.error("STOMP error", error);
          }
        );
      }

      function disconnect(user) {
        if (clients[user]) {
          clients[user].disconnect(() => {
            document.getElementById(`status${user}`).textContent =
              "Status: Disconnected";
            log(user, "Disconnected.");
          });
        }
      }

      async function sendMessage(user) {
        const token = document.getElementById(`token${user}`).value;
        const receiverId = document.getElementById(`receiverId${user}`).value;
        const content = document.getElementById(`message${user}`).value;

        if (!token || !receiverId || !content) {
          alert("Please provide Token, Receiver ID, and Message");
          return;
        }

        try {
          const response = await fetch(
            `${serverUrl}/api/v1/chat/send/messages`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${token}`,
              },
              body: JSON.stringify({
                receiverId: parseInt(receiverId),
                content: content,
              }),
            }
          );
          const result = await response.json();
          if (result.success) {
            document.getElementById(`message${user}`).value = "";
          } else {
            log(user, `API Error: ${result.message}`);
          }
        } catch (error) {
          log(user, `Fetch Error: ${error.message}`);
        }
      }
    </script>
  </body>
</html>
